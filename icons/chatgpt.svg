<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dark Funky Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#1a102f"/>
    </linearGradient>

    <!-- Vibrant Neon Gradients -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#ff7300"/>
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)"/>

  <!-- Funky Isometric / Minimal App Grid -->
  <g transform="translate(100, 100)">
    <!-- Main Center Icon (Homelab Server/Cube) -->
    <rect x="220" y="220" width="160" height="160" rx="40" fill="url(#neon-pink)" filter="url(#glow)"/>
    <path d="M260 270 h80 M260 300 h80 M260 330 h50" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

    <!-- Top Left Icon (Cloud/Network) -->
    <rect x="100" y="100" width="110" height="110" rx="30" fill="url(#neon-cyan)" opacity="0.9"/>
    <circle cx="155" cy="155" r="22" fill="#none" stroke="#ffffff" stroke-width="10"/>

    <!-- Bottom Right Icon (Database/Media) -->
    <rect x="390" y="390" width="110" height="110" rx="30" fill="url(#neon-purple)" opacity="0.9"/>
    <rect x="425" y="425" width="40" height="40" rx="10" fill="#ffffff"/>

    <!-- Small Decorative Floating Nodes (Funky Accents) -->
    <circle cx="440" cy="155" r="18" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="155" cy="440" r="18" fill="#ff2a85" filter="url(#glow)"/>
    
    <!-- Abstract Connecting Lines -->
    <path d="M210 155 h60 v65" stroke="#4facfe" stroke-width="6" stroke-dasharray="12 12" fill="none" opacity="0.6"/>
    <path d="M380 300 h70 v90" stroke="#e100ff" stroke-width="6" stroke-dasharray="12 12" fill="none" opacity="0.6"/>
  </g>
</svg>
